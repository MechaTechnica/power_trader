[pytest]
testpaths = packages
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto

addopts = 
    --strict-markers
    --strict-config
    --verbose
    --cov=packages
    --cov-report=html
    --cov-report=term-missing:skip-covered
    --cov-fail-under=80

markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
    requires_ib: Tests that require IB connection
