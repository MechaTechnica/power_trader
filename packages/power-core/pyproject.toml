[project]
name = "power-core"
version = "0.1.0"
description = "Core runtime infrastructure for Power Trader applications"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }

dependencies = [
    "power-framework",
    "that-depends>=1.13.0",
]

[tool.uv.sources]
power-framework = { workspace = true }

[project.entry-points."power.plugins"]
power-core = "power_core.bootstrap:create_container"

[project.optional-dependencies]
dev = [
    "mypy>=1.8.0",
    "ruff>=0.3.0",
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/power_core"]
