[project]
name = "power-market"
version = "0.1.0"
description = "Trading-domain contracts: market and signal types plus protocol interfaces"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Power Trader Team" }
]

dependencies = [
    "power-framework",
]

[tool.uv.sources]
power-framework = { workspace = true }

[project.optional-dependencies]
dev = [
    "mypy>=1.8.0",
    "ruff>=0.3.0",
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/power_market"]