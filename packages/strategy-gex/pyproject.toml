[project]
name = "power-trader-strategy-gex"
version = "0.1.0"
description = "GEX (Gamma Exposure) trading strategy plugin"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }

dependencies = [
    "power-framework",
    "power-market",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
]

[tool.uv.sources]
power-framework = { workspace = true }
power-market = { workspace = true }

[project.entry-points."power.plugins"]
"strategy.gex" = "power_trader_strategy_gex.plugin:GEXPlugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/power_trader_strategy_gex"]
