[project]
name = "power-framework"
version = "0.1.0"
description = "Pure protocols and types for trading applications - NO IMPLEMENTATIONS"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Power Trader Team" }
]

# Framework has NO dependencies - only protocols and types
dependencies = []

[project.optional-dependencies]
dev = [
    "mypy>=1.8.0",
    "ruff>=0.3.0",
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/power_trader_framework"]
