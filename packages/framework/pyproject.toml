[project]
name = "power-framework"
version = "0.1.0"
description = "Pure protocols and types for trading applications - NO IMPLEMENTATIONS"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Power Trader Team" }
]

# Framework exposes only interfaces, types, and config models - no runtime
# implementations. pydantic is needed for FrameworkSettings (a config model).
dependencies = [
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.8.0",
    "ruff>=0.3.0",
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/power_trader_framework"]
