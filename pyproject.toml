[project]
name = "power-trader-workspace"
version = "0.1.0"
description = "Day trading system with ML strategies and Interactive Brokers integration"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }

[tool.uv.workspace]
members = [
    "packages/framework",
    "packages/power-market",
    "packages/power-core",
    "packages/power-day-trader",
    "packages/strategy-momentum",
    "packages/strategy-gex",
]

[tool.uv.sources]
power-framework = { workspace = true }
power-market = { workspace = true }
power-core = { workspace = true }
power-day-trader = { workspace = true }
power-trader-strategy-momentum = { workspace = true }
power-trader-strategy-gex = { workspace = true }

[dependency-groups]
dev = [
    "mypy>=1.8.0",
    "ruff>=0.3.0",
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
]
